name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runtime: win-x64
          - platform: ARM64
            runtime: win-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        if: matrix.platform == 'x64'
        run: dotnet test tests/Citrium.Tests/Citrium.Tests.csproj -c Release

      - name: Build the demo
        run: dotnet build src/Citrium/Citrium.csproj -c Demo -p:Platform=${{ matrix.platform }}

      - name: Publish
        run: dotnet publish src/Citrium/Citrium.csproj -c Release -p:Platform=${{ matrix.platform }} -r ${{ matrix.runtime }} -o artifacts/Citrium-${{ matrix.runtime }}

      - name: Build the installer
        run: dotnet build installer/Citrium.Installer.wixproj -c Release -p:Platform=${{ matrix.platform }} "-p:PublishDir=${{ github.workspace }}\artifacts\Citrium-${{ matrix.runtime }}"
